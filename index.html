<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소방설비기사(전기) 실기 기출문제</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <h1>소방설비기사(전기) 실기 기출문제</h1>
    <div class="topbar-controls">
      <label for="categorySelect">카테고리</label>
      <select id="categorySelect"></select>
      <label for="yearSelect">회차</label>
      <select id="yearSelect"></select>
      <label for="modeSelect">모드</label>
      <select id="modeSelect">
        <option value="all">전체 순서대로</option>
        <option value="random">무작위</option>
        <option value="wrong">틀린 문제만</option>
      </select>
      <button id="resetStatsBtn" class="ghost-btn">기록 초기화</button>
    </div>
  </header>

  <div class="stats-bar" id="statsBar"></div>

  <main id="quizArea"></main>

  <footer class="nav-bar">
    <button id="prevBtn">← 이전</button>
    <span id="progressLabel"></span>
    <button id="nextBtn">다음 →</button>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
